<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cảm xúc — Life Balance</title>
  <meta name="description" content="Fire element — daily mind-cultivation practices to build emotional resilience." />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234caf50'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-family='Inter,sans-serif' font-weight='800' font-size='16' fill='white'>LB</text></svg>" />
  <link rel="stylesheet" href="css/style.css?v=44" />
</head>
<body>

  <div id="toast" role="status" aria-live="polite"></div>

  <header class="site-header">
    <div class="site-header__inner">
      <div class="logo">
        <div class="logo-mark">LB</div>
        <div class="logo-text">
          <strong>Life Balance</strong>
          <span>Five Elements Tracker</span>
        </div>
      </div>
      <span class="pi-status" id="pi-status">Checking Pi Browser…</span>
    </div>
  </header>

  <a class="journal-back" href="index.html"><span class="journal-back__arrow" aria-hidden="true">←</span> Home</a>

  <section class="journal-hero" style="--current-element: var(--fire); --current-element-tint: var(--fire-tint);">
    <div class="journal-hero__icon">🔥</div>
    <h1 class="journal-hero__title">Fire Element</h1>
    <p class="journal-hero__dimension">Mood — xây dựng cảm xúc</p>
  </section>

  <section class="daily-quest-section" id="daily-quest" style="--current-element: var(--fire); --current-element-tint: var(--fire-tint);">
    <h2 class="daily-quest-section__title">🔥 Tu Tâm — nhiệm vụ hàng ngày</h2>
    <p class="daily-quest-section__subtitle">Đốt cháy vô minh, thắp sáng tâm trí. Mỗi việc thực hành dưới đây tích thêm Hoả Khí cho hôm nay.</p>

    <div class="quest-add-row">
      <div class="quest-add-row__bottom">
        <input type="text" id="daily-quest-new-title" placeholder="Thêm việc thực hành mới…" />
        <input type="number" id="daily-quest-new-xp" min="0" value="10" aria-label="XP" />
        <button type="button" id="daily-quest-add-btn" class="btn btn-primary">Thêm</button>
      </div>
    </div>

    <button type="button" id="daily-quest-seed-btn" class="btn-text daily-quest-seed-btn">🕯️ Tạo 5 việc thực hành mẫu</button>

    <div id="daily-quest-list" class="daily-quest-list"></div>
  </section>

  <footer class="site-footer" role="contentinfo">
    <p>&copy; 2026 <strong>Life Balance</strong> — built for Pi Network App Studio.</p>
  </footer>

  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script src="js/common.js?v=10"></script>
  <script src="js/backupSync.js?v=3"></script>
  <script src="js/piAuth.js?v=4"></script>
  <script src="js/dailyTasks.js?v=2"></script>
  <script src="js/mood.js?v=2"></script>
</body>
</html>
